<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mithran AI</title>
<style>
  :root {
    --bg: #0f0f14; --panel: #17171f; --bubble-user: #4f46e5; --bubble-ai: #22222e;
    --text: #f1f1f5; --muted: #9a9ab0; --accent: #818cf8; --code-bg: #0a0a10; --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--panel); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #26262f; position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  #status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  #dot.on { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  #dot.busy { background: #fbbf24; animation: blink 1s infinite; }
  .icon-btn { background: #26262f; color: var(--text); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .icon-btn:active { transform: scale(.94); }
  #chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { max-width: 88%; padding: 11px 14px; border-radius: var(--radius); line-height: 1.5; font-size: 15px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; width: fit-content; max-width: 94%; }
  .msg.ai p { margin: 6px 0; } .msg.ai p:first-child { margin-top: 0; } .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai ul, .msg.ai ol { margin: 6px 0 6px 20px; }
  .msg.ai code.inline { background: #33333f; padding: 1px 6px; border-radius: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .codeblock { background: var(--code-bg); border: 1px solid #2c2c38; border-radius: 10px; margin: 8px 0; overflow: hidden; }
  .codeblock .chead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #1b1b25; font-size: 12px; color: var(--muted); }
  .codeblock .chead button { background: var(--accent); border: none; color: #0f0f14; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
  .codeblock pre { padding: 10px 12px; overflow-x: auto; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.45; }
  .cursor::after { content: "▍"; animation: blink 0.8s infinite; color: var(--accent); }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  #composer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid #26262f; }
  #form { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
  #input { flex: 1; background: #22222e; border: 1px solid #33333f; color: var(--text); border-radius: 24px; padding: 12px 16px; font-size: 15px; outline: none; resize: none; max-height: 120px; font-family: inherit; }
  #input:focus { border-color: var(--accent); }
  #input:disabled { opacity: .5; }
  #send { background: var(--accent); border: none; color: #0f0f14; font-weight: 800; width: 48px; height: 48px; border-radius: 50%; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  #send:disabled { opacity: .4; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  #modal.open { display: flex; }
  #sheet { background: var(--panel); border-radius: 18px; padding: 22px; width: 100%; max-width: 420px; }
  #sheet h2 { font-size: 17px; margin-bottom: 6px; }
  #sheet .sub { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
  #sheet label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  #sheet select { width: 100%; background: #22222e; border: 1px solid #33333f; color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; }
  #sheet .row { display: flex; gap: 10px; margin-top: 18px; }
  #sheet .row button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  #saveBtn { background: var(--accent); color: #0f0f14; }
  #closeBtn { background: #2a2a35; color: var(--text); }
  .empty { text-align: center; color: var(--muted); margin: auto; padding: 30px 20px; line-height: 1.7; max-width: 420px; }
  .empty .big { font-size: 44px; display: block; margin-bottom: 10px; }
  .empty button { margin-top: 14px; background: var(--accent); color: #0f0f14; border: none; font-weight: 800; font-size: 16px; padding: 13px 30px; border-radius: 14px; cursor: pointer; }
  #loadbar { display: none; margin: 14px auto 0; max-width: 420px; text-align: center; }
  #loadbar .track { background: #26262f; border-radius: 10px; height: 10px; overflow: hidden; margin-top: 8px; }
  #loadbar .fill { background: var(--accent); height: 100%; width: 0%; transition: width .2s; }
  #loadbar .lbl { font-size: 13px; color: var(--muted); }
  .warn { background: #3a2b12; border: 1px solid #8a6d2f; color: #f5d98b; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.6; max-width: 480px; margin: auto; }
</style>
</head>
<body>

<header>
  <h1>⚡ <span>Mithran</span> AI</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="status"><span id="dot"></span><span id="statusTxt">loading…</span></div>
    <button class="icon-btn" id="clearBtn" title="New chat">🗑️</button>
    <button class="icon-btn" id="settingsBtn" title="Models">⚙️</button>
  </div>
</header>

<div id="chat"></div>
<div id="loadbar"><div class="lbl" id="loadLbl">Downloading AI model…</div><div class="track"><div class="fill" id="loadFill"></div></div></div>

<div id="composer">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask anything…" disabled></textarea>
    <button type="submit" id="send" disabled>➤</button>
  </form>
</div>

<div id="modal">
  <div id="sheet">
    <h2>⚙️ AI Model</h2>
    <div class="sub">Runs 100% on your device. No API key, no signup, no server — your chats never leave your phone. Bigger models are smarter but slower to download.</div>
    <label>Model</label>
    <select id="modelSel"></select>
    <div class="row">
      <button id="closeBtn" type="button">Cancel</button>
      <button id="saveBtn" type="button">Load model</button>
    </div>
  </div>
</div>

<script type="module">
const WEBLLM_URL = "https://esm.sh/@mlc-ai/web-llm";
let CreateMLCEngine = null, prebuiltAppConfig = null;

const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modal = document.getElementById('modal');
const dot = document.getElementById('dot');
const statusTxt = document.getElementById('statusTxt');
const modelSel = document.getElementById('modelSel');
const loadbar = document.getElementById('loadbar');
const loadFill = document.getElementById('loadFill');
const loadLbl = document.getElementById('loadLbl');

let engine = null, engineReady = false, currentModel = null;
let history = [];
try { history = JSON.parse(localStorage.getItem('mai_hist') || '[]'); } catch(e){ history = []; }
try { currentModel = localStorage.getItem('mai_model') || null; } catch(e){}

const SYSTEM = "You are Mithran AI, a friendly assistant running on the user's own device. You are good at coding: give complete, working code in fenced code blocks, not snippets. Explain simply and briefly.";

// ---------- tiny markdown ----------
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMD(text){
  const parts = []; const codeRe = /```(\w*)\n([\s\S]*?)```/g;
  let last = 0, m;
  while((m = codeRe.exec(text))){
    parts.push({t:'md', s:text.slice(last, m.index)});
    parts.push({t:'code', lang:m[1]||'code', s:m[2].replace(/\n$/,'')});
    last = m.index + m[0].length;
  }
  parts.push({t:'md', s:text.slice(last)});
  return parts.map(p => {
    if(p.t === 'code'){
      const id = 'c' + Math.random().toString(36).slice(2,9);
      return `<div class="codeblock"><div class="chead"><span>${esc(p.lang)}</span><button onclick="copyCode('${id}',this)">Copy</button></div><pre id="${id}">${esc(p.s)}</pre></div>`;
    }
    let h = esc(p.s);
    h = h.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const lines = h.split('\n'); let out = '', inList = false;
    for(const ln of lines){
      if(/^\s*[-*] /.test(ln)){ if(!inList){ out += '<ul>'; inList = true; } out += '<li>' + ln.replace(/^\s*[-*] /, '') + '</li>'; }
      else { if(inList){ out += '</ul>'; inList = false; } if(ln.trim()) out += '<p>' + ln + '</p>'; }
    }
    if(inList) out += '</ul>';
    return out;
  }).join('');
}
window.copyCode = function(id, btn){
  navigator.clipboard.writeText(document.getElementById(id).innerText)
    .then(()=>{ btn.textContent = 'Copied!'; setTimeout(()=>btn.textContent='Copy',1500); });
};

// ---------- chat UI ----------
function addMsg(role, html){
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function setStatus(mode, txt){
  dot.className = mode === 'on' ? 'on' : (mode === 'busy' ? 'busy' : '');
  statusTxt.textContent = txt;
}
function showStart(){
  chat.innerHTML = `<div class="empty"><span class="big">⚡</span>
    <strong>Hey, I'm Mithran AI.</strong><br>
    I run entirely on your device — no API key, no account, nothing leaves your phone.<br>
    <button id="startBtn">Download &amp; start</button>
    <div style="font-size:12px;margin-top:10px">First load downloads the AI (~1 GB). Use Wi-Fi — after that it works offline.</div></div>`;
  document.getElementById('startBtn').onclick = () => loadModel(currentModel || defaultModel());
  input.disabled = true; sendBtn.disabled = true;
}
function showNoGPU(){
  chat.innerHTML = `<div class="warn">⚠️ <strong>Can't run on this browser.</strong><br><br>
    On-device AI needs WebGPU. Please open this file in:<br>
    • <strong>iPhone:</strong> Safari on iOS 26 or newer<br>
    • <strong>Android / computer:</strong> Chrome or Edge (recent version)<br><br>
    Then reload the page.</div>`;
  setStatus('off', 'unsupported');
}
function saveHistory(){ try{ localStorage.setItem('mai_hist', JSON.stringify(history.slice(-40))); }catch(e){} }
function renderHistory(){
  chat.innerHTML = '';
  if(!history.length){ showStart(); return; }
  for(const h of history) addMsg(h.role === 'user' ? 'user' : 'ai', h.role === 'user' ? esc(h.text) : renderMD(h.text));
  input.disabled = !engineReady; sendBtn.disabled = true;
}

// ---------- models ----------
function smallModels(){
  const list = (prebuiltAppConfig.model_list || []).map(m => m.model_id).filter(Boolean);
  // prefer small instruct models
  const scored = list.map(id => {
    const low = id.toLowerCase();
    let score = 50;
    const sz = low.match(/(\d+(\.\d+)?)\s*b/);
    const num = sz ? parseFloat(sz[1]) : 99;
    if(num <= 1.2) score = 1; else if(num <= 2) score = 2; else if(num <= 3.5) score = 3; else if(num <= 8) score = 4; else score = 5;
    if(!/instruct/i.test(id)) score += 10;
    if(!/q4f16_1/i.test(id)) score += 5;
    return { id, score };
  }).sort((a,b) => a.score - b.score);
  return scored.map(s => s.id);
}
let modelIds = [];
function defaultModel(){
  return modelIds[0] || null;
}
function fillModelSelect(){
  modelSel.innerHTML = '';
  for(const id of modelIds){
    const o = document.createElement('option');
    o.value = id; o.textContent = id.replace(/-q4f16_1-MLC$/, '');
    if(id === currentModel) o.selected = true;
    modelSel.appendChild(o);
  }
}

// ---------- engine ----------
async function loadModel(modelId){
  if(!modelId) return;
  if(engine){ try{ await engine.unload(); }catch(e){} engine = null; }
  engineReady = false; currentModel = modelId;
  try{ localStorage.setItem('mai_model', modelId); }catch(e){}
  setStatus('busy', 'downloading…');
  loadbar.style.display = 'block';
  input.disabled = true; sendBtn.disabled = true;
  if(!history.length) chat.innerHTML = '';
  try{
    engine = await CreateMLCEngine(modelId, {
      initProgressCallback: (r) => {
        loadLbl.textContent = r.text || 'Loading…';
        loadFill.style.width = Math.round((r.progress || 0) * 100) + '%';
      }
    });
    engineReady = true;
    setStatus('on', 'ready');
    loadbar.style.display = 'none';
    input.disabled = false;
    if(!history.length){
      addMsg('ai', renderMD("⚡ **Mithran AI is ready!** Ask me anything — questions, code, writing, ideas. I work offline from here."));
    }
  }catch(err){
    setStatus('off', 'failed');
    loadbar.style.display = 'none';
    addMsg('ai', `<p>⚠️ Couldn't load the model: ${esc(err.message || err)}</p><p style="color:var(--muted);font-size:13px">Check your connection and tap ⚙️ to try a smaller model.</p>`);
  }
  chat.scrollTop = chat.scrollHeight;
}

// ---------- send ----------
input.addEventListener('input', () => {
  sendBtn.disabled = !input.value.trim() || !engineReady;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text || !engineReady) return;
  input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
  addMsg('user', esc(text));
  history.push({ role:'user', text });
  const bubble = addMsg('ai', '<span class="cursor"></span>');
  let full = '';
  try{
    const msgs = [{ role:'system', content: SYSTEM },
      ...history.slice(-8).map(h => ({ role: h.role === 'user' ? 'user' : 'assistant', content: h.text }))];
    const stream = await engine.chat.completions.create({ messages: msgs, stream: true, temperature: 0.7 });
    for await (const chunk of stream){
      const delta = chunk.choices?.[0]?.delta?.content || '';
      if(delta){ full += delta; bubble.innerHTML = renderMD(full) + '<span class="cursor"></span>'; chat.scrollTop = chat.scrollHeight; }
    }
    bubble.innerHTML = renderMD(full) || '<p>(no reply)</p>';
    history.push({ role:'ai', text: full });
    saveHistory();
  }catch(err){
    bubble.innerHTML = `<p>⚠️ ${esc(err.message || 'Something went wrong')}</p>`;
  }
  chat.scrollTop = chat.scrollHeight;
});

// ---------- settings / misc ----------
document.getElementById('settingsBtn').onclick = () => modal.classList.add('open');
document.getElementById('closeBtn').onclick = () => modal.classList.remove('open');
document.getElementById('saveBtn').onclick = () => { modal.classList.remove('open'); loadModel(modelSel.value); };
document.getElementById('clearBtn').onclick = () => {
  if(confirm('Start a new chat?')){ history = []; saveHistory(); engineReady ? renderHistory() : showStart(); }
};

function showLibError(){
  chat.innerHTML = `<div class="warn">⚠️ <strong>Couldn't load the AI library.</strong><br><br>
    This usually means the file preview is blocking internet access, or your connection dropped.<br><br>
    Try:<br>
    • Reopening the file with Wi-Fi on<br>
    • Or hosting it on GitHub Pages and opening the real link in Safari</div>`;
  setStatus('off', 'failed');
}
// ---------- boot ----------
(async function boot(){
  try{
    const mod = await import(WEBLLM_URL);
    CreateMLCEngine = mod.CreateMLCEngine;
    prebuiltAppConfig = mod.prebuiltAppConfig;
  }catch(e){ showLibError(); return; }

  if(!('gpu' in navigator)){
    showNoGPU();
    modelIds = (prebuiltAppConfig.model_list || []).map(m => m.model_id).filter(Boolean);
    fillModelSelect();
    return;
  }
  modelIds = smallModels();
  if(!currentModel || !modelIds.includes(currentModel)) currentModel = defaultModel();
  fillModelSelect();
  renderHistory();
  setStatus('off', 'not loaded');
})();
</script>
</body>
</html>
